<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Úľová váha</title>
<style>
  :root {
    --bg: #faf7f0; --card: #ffffff; --text: #2b2a26; --muted: #77736a;
    --accent: #d98e04; --accent-soft: #fbe9c4; --line: #e8e2d4; --bad: #c0392b; --good: #2e8b57;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a17; --card: #262521; --text: #f1ede4; --muted: #a29d91;
      --accent: #f0a91c; --accent-soft: #3a3020; --line: #3a3832; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  #prihlasenie { max-width: 480px; margin: 40px auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 1.4rem; margin: 0; }
  h1 span { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  button { padding: 10px 16px; font-size: 1rem; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  .help { font-size: .85rem; color: var(--muted); line-height: 1.4; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat .k { font-size: .8rem; color: var(--muted); }
  .stat .v { font-size: 1.7rem; font-weight: 700; margin-top: 4px; }
  .stat .v small { font-size: .9rem; font-weight: 400; color: var(--muted); }
  .up { color: var(--good); } .down { color: var(--bad); }
  .ranges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .ranges button { background: transparent; color: var(--accent); padding: 6px 12px; font-size: .9rem; }
  .ranges button.on { background: var(--accent); color: #fff; }
  .chartbox { position: relative; height: clamp(260px, 60vh, 640px); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  /* PC a tablet: 4 okienka vedľa seba, graf vyšší */
  @media (min-width: 760px) {
    .stats { grid-template-columns: repeat(4, 1fr); }
    main { padding: 24px 32px; }
    .chartbox { height: calc(100vh - 320px); min-height: 320px; }
  }
  /* mobil na šírku: všetko natesno, graf cez skoro celú obrazovku */
  @media (orientation: landscape) and (max-height: 500px) {
    main { padding: 8px 16px; }
    header { margin-bottom: 8px; }
    h1 { font-size: 1.1rem; }
    header button { padding: 4px 10px; font-size: .85rem; }
    .stats { grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
    .stat { padding: 6px 10px; }
    .stat .v { font-size: 1.15rem; margin-top: 0; }
    .card { padding: 8px 12px; margin-bottom: 8px; }
    .ranges { margin-bottom: 4px; }
    .ranges button { padding: 3px 10px; font-size: .8rem; }
    .chartbox { height: calc(100vh - 150px); min-height: 160px; }
    .foot { margin-top: 0; }
  }
  .err { color: var(--bad); margin-top: 10px; }
  .hidden { display: none; }
  .foot { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🐝 Úľová <span>váha</span></h1>
    <button id="odhlasit" class="ghost hidden">Odhlásiť</button>
  </header>

  <!-- PRIHLÁSENIE -->
  <section id="prihlasenie" class="card hidden">
    <h2 style="margin-top:0">Prihlásenie</h2>
    <p class="help">Zadaj údaje zo svojho ThingSpeak kanála. Stránka si ich zapamätá v tomto zariadení.</p>
    <label for="kanal">Číslo kanála (Channel ID)</label>
    <input id="kanal" inputmode="numeric" placeholder="napr. 2712345">
    <label for="kluc">Read API Key</label>
    <input id="kluc" placeholder="ThingSpeak → API Keys → Read API Key">
    <div style="margin-top:16px"><button id="prihlasit">Prihlásiť</button></div>
    <div id="chyba" class="err"></div>
  </section>

  <!-- PREHĽAD -->
  <section id="prehlad" class="hidden">
    <div class="stats">
      <div class="stat"><div class="k">Hmotnosť teraz</div><div class="v" id="sTeraz">–</div></div>
      <div class="stat"><div class="k">Zmena za 24 h</div><div class="v" id="sDen">–</div></div>
      <div class="stat"><div class="k">Teplota</div><div class="v" id="sTeplota">–</div></div>
      <div class="stat"><div class="k">Vlhkosť</div><div class="v" id="sVlhkost">–</div></div>
    </div>
    <div class="card">
      <div class="ranges">
        <button data-dni="1" class="on">24 hodín</button>
        <button data-dni="7">7 dní</button>
        <button data-dni="30">30 dní</button>
        <button data-dni="90">90 dní</button>
      </div>
      <div class="chartbox"><canvas id="graf"></canvas></div>
      <div id="chyba2" class="err"></div>
    </div>
    <div class="foot" id="posledne"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let graf = null, dni = 1, cisloPoziadavky = 0;

function nacitajPrihlasenie() {
  try { return JSON.parse(localStorage.getItem('ulovaVaha') || 'null'); } catch (e) { return null; }
}
function ulozPrihlasenie(p) { try { localStorage.setItem('ulovaVaha', JSON.stringify(p)); } catch (e) {} }
function zmazPrihlasenie() { try { localStorage.removeItem('ulovaVaha'); } catch (e) {} }

async function stiahni(p, dni) {
  const url = `https://api.thingspeak.com/channels/${encodeURIComponent(p.kanal)}/feeds.json`
    + `?api_key=${encodeURIComponent(p.kluc)}&days=${dni}&results=8000`
    // pri dlhších obdobiach si pýtame priemery (inak by ThingSpeak poslal len posledných 8000 meraní)
    + (dni >= 90 ? '&average=240' : dni >= 30 ? '&average=60' : dni >= 7 ? '&average=20' : '')
    + `&_=${Date.now()}`;
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('zle');
  const d = await r.json();
  if (d === -1 || !d.feeds) throw new Error('zle');
  return d.feeds.map(f => ({
    t: new Date(f.created_at),
    kg: f.field1 != null && f.field1 !== '' ? parseFloat(f.field1) : null,
    tep: f.field2 != null && f.field2 !== '' ? parseFloat(f.field2) : null,
    vlh: f.field3 != null && f.field3 !== '' ? parseFloat(f.field3) : null,
  }));
}

function posledna(data, kluc) {
  for (let i = data.length - 1; i >= 0; i--) if (data[i][kluc] != null && !isNaN(data[i][kluc])) return data[i];
  return null;
}

function ukazStatistiky(data) {
  const p = posledna(data, 'kg');
  $('sTeraz').innerHTML = p ? `${p.kg.toFixed(2)} <small>kg</small>` : '–';
  // zmena za 24 h: posledná hodnota mínus hodnota spred 24 hodín
  if (p) {
    const ciel = p.t.getTime() - 24 * 3600 * 1000;
    let pred = null;
    for (const z of data) if (z.kg != null && z.t.getTime() <= ciel) pred = z;
    if (pred) {
      const r = p.kg - pred.kg;
      $('sDen').innerHTML = `<span class="${r >= 0 ? 'up' : 'down'}">${r >= 0 ? '+' : ''}${r.toFixed(2)}</span> <small>kg</small>`;
    } else $('sDen').innerHTML = '<small>málo údajov</small>';
    $('posledne').textContent = 'Posledné meranie: ' + p.t.toLocaleString('sk-SK');
  }
  const t = posledna(data, 'tep'), v = posledna(data, 'vlh');
  $('sTeplota').innerHTML = t ? `${t.tep.toFixed(1)} <small>°C</small>` : '<small>zatiaľ nemeria</small>';
  $('sVlhkost').innerHTML = v ? `${v.vlh.toFixed(0)} <small>%</small>` : '<small>zatiaľ nemeria</small>';
}

function nakresli(data) {
  const farba = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const text = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
  const ciary = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
  const body = data.filter(z => z.kg != null).map(z => ({ x: z.t, y: z.kg }));
  if (graf) graf.destroy();
  graf = new Chart($('graf'), {
    type: 'line',
    data: { datasets: [{ label: 'Hmotnosť (kg)', data: body, borderColor: farba,
      backgroundColor: farba + '33', fill: true, pointRadius: body.length > 60 ? 0 : 3, tension: .25 }] },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false },
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => c.parsed.y.toFixed(2) + ' kg' } } },
      scales: {
        x: { type: 'time', time: { tooltipFormat: 'd.M.yyyy HH:mm',
             displayFormats: { minute: 'HH:mm', hour: 'HH:mm', day: 'd.M.' } },
             ticks: { color: text, maxTicksLimit: 7 }, grid: { color: ciary } },
        y: { ticks: { color: text, callback: v => v + ' kg' }, grid: { color: ciary } }
      }
    }
  });
}

async function obnov() {
  const p = nacitajPrihlasenie();
  if (!p) return;
  const moje = ++cisloPoziadavky;   // keď medzitým klikneš na iné obdobie, staré údaje zahodíme
  const mojeDni = dni;
  $('chyba2').textContent = '';
  try {
    const [data, dataStat] = await Promise.all([stiahni(p, mojeDni), stiahni(p, 2)]);
    if (moje !== cisloPoziadavky) return;
    ukazStatistiky(dataStat);
    nakresli(data);
    if (!data.some(z => z.kg != null)) $('chyba2').textContent = 'V tomto období nie sú žiadne merania.';
  } catch (e) {
    if (moje !== cisloPoziadavky) return;
    $('chyba2').textContent = 'Nepodarilo sa načítať údaje. Skontroluj internet.';
  }
}

function ukaz() {
  const p = nacitajPrihlasenie();
  $('prihlasenie').classList.toggle('hidden', !!p);
  $('prehlad').classList.toggle('hidden', !p);
  $('odhlasit').classList.toggle('hidden', !p);
  if (p) obnov();
}

$('prihlasit').onclick = async () => {
  const p = { kanal: $('kanal').value.trim(), kluc: $('kluc').value.trim() };
  $('chyba').textContent = '';
  if (!p.kanal) { $('chyba').textContent = 'Zadaj číslo kanála.'; return; }
  try { await stiahni(p, 1); ulozPrihlasenie(p); ukaz(); }
  catch (e) { $('chyba').textContent = 'Číslo kanála alebo kľúč nesedí. Skontroluj ich v ThingSpeaku.'; }
};
$('odhlasit').onclick = () => { zmazPrihlasenie(); if (graf) graf.destroy(); graf = null; ukaz(); };
document.querySelectorAll('.ranges button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.ranges button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); dni = +b.dataset.dni; obnov();
});
setInterval(obnov, 60000);   // každú minútu sa sama obnoví
ukaz();
</script>
</body>
</html>
